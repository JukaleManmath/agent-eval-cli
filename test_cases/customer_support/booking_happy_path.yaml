meta:
  schema_version: "1.0"
  scenario_id: "booking-happy-path-001"
  name: "Customer successfully books a table"
  tags: ["booking", "happy-path"]

agent:
  endpoint: "http://localhost:8000/chat"
  method: "POST"
  headers:
    Content-Type: "application/json"
  request_template: |
    {
      "session_id": "${SESSION_ID}",
      "message": "${USER_MESSAGE}"
    }
  response_path: "response"
  timeout_seconds: 30

user_persona:
  name: "Alice"
  tone: "friendly and straightforward"
  background: "Wants to book a table for two for a date night"
  opening_message: "Hi, I'd like to book a table for two at 7pm this Saturday."

outcome_type: success

conversation:
  max_turns: 8
  min_turns: 2
  expected_turns: 4

evaluation:
  success_intent: "Customer receives a confirmed table booking with a reference number"
  forbidden_phrases:
    - "I cannot help"
    - "I don't know"
    - "not possible"
  required_phrases:
    - "BK-"
  context_facts:
    - "TableEase is a restaurant booking service"
    - "Bookings are confirmed with a reference number starting with BK-"
    - "Agent should ask for name and time if not provided"
  thresholds:
    task_completion: 0.65
    instruction_following: 0.80
    turn_efficiency: 0.60
    aggregate: 0.70

scripted_turns:
  - "Hi, I'd like to book a table for two at 7pm this Saturday."
  - "My name is Alice Johnson."
  - "Saturday the 3rd works perfectly."
  - "That's great, thank you!"
